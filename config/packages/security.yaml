security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User:
            algorithm: auto

    role_hierarchy:
        ROLE_ADMIN: [ROLE_STAFF, ROLE_USER]
        ROLE_STAFF: [ROLE_USER]
 
        # Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
    
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:

            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api_platform:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: App\Security\JWTAuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            lazy: true
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticator: 
                - App\Security\GoogleAuthenticator
                - App\Security\LoginAuthenticator

            logout:
                path: app_logout
                target: app_login
                # where to redirect after logout
                # target: app_any_route

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true


    access_control:
         # Allow login/logout for everyone
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }

        - { path: ^/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google, roles: PUBLIC_ACCESS }   
        - { path: ^/api/products, roles: PUBLIC_ACCESS }

        - { path: ^/api/users, roles: ROLE_ADMIN }
        - { path: ^/api/customers, roles: ROLE_ADMIN }
        - { path: ^/api/stocks, roles: ROLE_ADMIN }
        - { path: ^/api/categories, roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/api/orders, roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/api/activity_logs, roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        # Admin-only routes
        - { path: ^/dashboard, roles: ROLE_ADMIN }
        - { path: ^/user, roles: ROLE_ADMIN }
        
        # Staff and Admin routes (product, category, stock, order management)
        - { path: ^/product, roles: [ROLE_ADMIN, ROLE_STAFF, ROLE_USER] }
        - { path: ^/category, roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/stock, roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/order, roles: [ROLE_ADMIN, ROLE_STAFF] }
        
when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon