security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    role_hierarchy:
        ROLE_ADMIN: [ROLE_STAFF, ROLE_USER]
        ROLE_STAFF: [ROLE_USER]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api_platform:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: App\Security\JWTAuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            lazy: true

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticator:
                - App\Security\GoogleAuthenticator
                - App\Security\LoginAuthenticator

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        # Public routes
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google, roles: PUBLIC_ACCESS }
        - { path: ^/api/products, roles: PUBLIC_ACCESS }

        # Admin only
        - { path: ^/api/users, roles: ROLE_ADMIN }
        - { path: ^/api/customers, roles: ROLE_ADMIN }
        - { path: ^/api/stocks, roles: ROLE_ADMIN }

        # Admin and Staff only
        - { path: ^/api/categories, roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/api/activity_logs, roles: [ROLE_ADMIN, ROLE_STAFF] }

        # All authenticated users (mobile app customers + staff + admin)
        - { path: ^/api/orders, roles: IS_AUTHENTICATED_FULLY }

        # All authenticated API routes
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

        # Web dashboard routes
        - { path: ^/dashboard, roles: ROLE_ADMIN }
        - { path: ^/user, roles: ROLE_ADMIN }
        - { path: ^/product, roles: [ROLE_ADMIN, ROLE_STAFF, ROLE_USER] }
        - { path: ^/category, roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/stock, roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/order, roles: [ROLE_ADMIN, ROLE_STAFF] }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10